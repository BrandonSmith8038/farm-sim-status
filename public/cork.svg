<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!-- Dark flecks in the cork. Stitching makes the edges meet, so the tile repeats without a seam. -->
  <filter id="flecks" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .25  0 0 0 0 .13  0 0 0 0 .04  3.4 0 0 0 -1.45"/>
  </filter>
  <rect width="500" height="500" filter="url(#flecks)"/>
</svg>
