<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Farm Sim Status</title>
  <link rel="stylesheet" href="style.css">
  <script src="fields.js" defer></script>
  <script src="animals.js" defer></script>
  <script src="todos.js" defer></script>
  <script src="notes.js" defer></script>
  <script src="welcome.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="title">
      <span class="app-name">Farm Sim Status</span>
      <div id="map-view" class="map-view">
        <span id="map-text" class="map-text"></span>
        <button id="map-edit" class="map-edit" type="button" aria-label="Edit map name" title="Edit map name" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
          </svg>
        </button>
      </div>
      <input id="map-input" class="map-input" type="text" maxlength="60" aria-label="Map name" hidden>
    </div>
    <div class="top-actions">
      <span id="status" class="status" role="status"></span>
      <div id="add-menu" class="add-menu">
        <button id="add-button" class="add-button" type="button" aria-label="Add new" title="Add new" aria-expanded="false" aria-controls="add-list" disabled>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/>
          </svg>
        </button>
        <div id="add-list" class="add-list" hidden>
          <button class="add-item" type="button" data-tab="fields" data-add="field">Field</button>
          <button class="add-item" type="button" data-tab="animals" data-add="animals">Animals</button>
          <button class="add-item" type="button" data-tab="todos" data-add="todo">To-do</button>
          <button class="add-item" type="button" data-tab="todos" data-add="plan">Future plan</button>
          <button class="add-item" type="button" data-tab="notes" data-add="note">Note</button>
        </div>
      </div>
    </div>
  </header>

  <section id="welcome" class="welcome" aria-labelledby="welcome-title" hidden>
    <div class="welcome-head">
      <h2 id="welcome-title" class="welcome-title">Welcome back</h2>
      <span id="welcome-date" class="welcome-date"></span>
      <button id="welcome-toggle" class="note-more welcome-toggle" type="button" aria-expanded="true" aria-controls="welcome-columns">Hide</button>
    </div>
    <div id="welcome-columns" class="welcome-columns">
      <div>
        <h3 class="welcome-heading">To-dos</h3>
        <ul id="welcome-todos" class="list welcome-list"></ul>
      </div>
      <div>
        <h3 class="welcome-heading">Needs attention</h3>
        <ul id="welcome-attention" class="list welcome-list"></ul>
      </div>
      <div>
        <h3 class="welcome-heading">Notes</h3>
        <ul id="welcome-notes" class="list welcome-list"></ul>
      </div>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" type="button" role="tab" data-tab="fields">Fields</button>
    <button class="tab" type="button" role="tab" data-tab="animals">Animals</button>
    <button class="tab" type="button" role="tab" data-tab="todos">To-Do &amp; Plans</button>
    <button class="tab" type="button" role="tab" data-tab="notes">Notes</button>
  </nav>

  <main>
    <section class="panel" role="tabpanel" data-panel="fields">
      <p id="fields-empty" class="empty" hidden>No fields yet. Use the + button at the top to add your first card.</p>
      <div id="field-grid" class="card-grid"></div>
    </section>
    <section class="panel" role="tabpanel" data-panel="animals">
      <p id="animals-empty" class="empty" hidden>No animals yet. Use the + button at the top to add your first card.</p>
      <div id="animal-grid" class="card-grid"></div>
    </section>
    <section class="panel" role="tabpanel" data-panel="todos">
      <div id="todo-columns" class="todo-columns"></div>
    </section>
    <section id="notes-panel" class="panel" role="tabpanel" data-panel="notes"></section>
  </main>
</body>
</html>
