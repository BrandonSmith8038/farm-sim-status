<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600">
  <defs>
    <!-- Long dark streaks stretched up the plank, then bent so the grain wanders -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".07 .0025" numOctaves="4" seed="8" result="noise"/>
      <feColorMatrix in="noise" values="0 0 0 0 .09  0 0 0 0 .04  0 0 0 0 .01  1.9 0 0 0 -.75" result="lines"/>
      <feTurbulence type="fractalNoise" baseFrequency=".004 .002" numOctaves="2" seed="2" result="bend"/>
      <feDisplacementMap in="lines" in2="bend" scale="70" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Fine pores in the wood -->
    <filter id="pores" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".55 .012" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 .07  0 0 0 0 .03  0 0 0 0 .01  1.7 0 0 0 -.75"/>
    </filter>
    <radialGradient id="knot">
      <stop offset="0" stop-color="#1c0e05"/>
      <stop offset=".45" stop-color="#2e1809" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2e1809" stop-opacity="0"/>
    </radialGradient>
    <!-- One knot, with growth rings around it -->
    <g id="knot-mark" fill="none" stroke="#1f1006">
      <ellipse rx="26" ry="42" fill="url(#knot)" stroke="none"/>
      <ellipse rx="24" ry="44" stroke-opacity=".4" stroke-width="2"/>
      <ellipse rx="34" ry="66" stroke-opacity=".28" stroke-width="2"/>
      <ellipse rx="44" ry="92" stroke-opacity=".16" stroke-width="2"/>
    </g>
  </defs>

  <!-- Each plank is its own shade, like boards cut from different trees -->
  <rect x="0" width="320" height="1600" fill="#7c532f"/>
  <rect x="320" width="320" height="1600" fill="#875b33"/>
  <rect x="640" width="320" height="1600" fill="#734b29"/>
  <rect x="960" width="320" height="1600" fill="#815836"/>
  <rect x="1280" width="320" height="1600" fill="#784f2c"/>
  <rect x="1600" width="320" height="1600" fill="#8b5f3a"/>
  <rect x="1920" width="320" height="1600" fill="#704829"/>
  <rect x="2240" width="320" height="1600" fill="#80552f"/>

  <rect x="-80" y="-80" width="2720" height="1760" filter="url(#grain)"/>
  <rect width="2560" height="1600" filter="url(#pores)"/>

  <use href="#knot-mark" x="470" y="1040"/>
  <use href="#knot-mark" x="1120" y="240"/>
  <use href="#knot-mark" x="1760" y="1280"/>
  <use href="#knot-mark" x="2390" y="620"/>

  <!-- The gaps between planks, each with a lit edge beside it -->
  <g fill="#150a03">
    <rect x="318" width="4" height="1600"/>
    <rect x="638" width="4" height="1600"/>
    <rect x="958" width="4" height="1600"/>
    <rect x="1278" width="4" height="1600"/>
    <rect x="1598" width="4" height="1600"/>
    <rect x="1918" width="4" height="1600"/>
    <rect x="2238" width="4" height="1600"/>
    <rect x="2558" width="2" height="1600"/>
    <rect x="0" width="2" height="1600"/>
  </g>
  <g fill="#c99a68" fill-opacity=".22">
    <rect x="322" width="2" height="1600"/>
    <rect x="642" width="2" height="1600"/>
    <rect x="962" width="2" height="1600"/>
    <rect x="1282" width="2" height="1600"/>
    <rect x="1602" width="2" height="1600"/>
    <rect x="1922" width="2" height="1600"/>
    <rect x="2242" width="2" height="1600"/>
    <rect x="2" width="2" height="1600"/>
  </g>
</svg>
