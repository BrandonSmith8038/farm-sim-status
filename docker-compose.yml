services:
  farm-sim-status:
    build: .
    container_name: farm-sim-status
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: "http://192.168.1.157:${PORT:-8210}/icon.png"   # Unraid Docker tab icon
    ports:
      - "${PORT:-8210}:8210"   # set PORT in .env (not committed)
    volumes:
      - /mnt/user/appdata/farm-sim-status:/data
